/**:   # 任何 namespace 下的 cbba_node 都吃這份（裸的 cbba_node: 對不到 /v60/cbba_node）
  ros__parameters:
    agent_id: 1
    agent_type: "UAV"
    # 速度、耗電（續航 900 s 換算）、存量、bundle 上限（2）：2026-11-15 起是平台的參數，數值在 registry/platforms.yaml，
    # 程式預設和它一樣。cbba_uav.sh 用 -p 給 SITL 實際的速度（CBBA_SPEED）、續航（SIM_BAT_DRAIN）
    recon_altitude: 5.0       # AIR_RECON 的 z 低於這個高度就抬到巡檢高度；能量模型用 UAV 預設
    preempt_exclude_sec: 5.0  # 被接管（PREEMPTED_BY_MANUAL）交還的任務多久不接：只擋「回報先到、mode = MANUAL 晚到」的空檔；接管期間靠 MANUAL 不出價，做完回到 AUTO 就能接回（2026-10-17）
    # 備用 BT 的 fire_task.divert_on_sight（預設關）也用 PREEMPTED：打開時，監控火點期間可能被派回原任務
    cancel_authorities: [200] # 閘道（2-1b，participate: never）可以取消任何任務；全隊要一樣（2026-11-12）
