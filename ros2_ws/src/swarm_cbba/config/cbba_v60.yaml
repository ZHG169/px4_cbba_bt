/**:   # 任何 namespace 下的 cbba_node 都吃這份（裸的 cbba_node: 對不到 /v60/cbba_node）
  ros__parameters:
    agent_id: 50
    agent_type: "UGV"
    state_timeout: 1.5
    assign_hold: 0.4          # spec §2.3 規則 1：2 個廣播週期（節點預設也是 0.4）
    cruise_speed: 1.0         # 佔位，待實測（cbba_core/doc/ugv_tuning.md）
    energy_per_meter: 0.1
    hover_energy_per_sec: 0.05
    safety_reserve: 20.0
    preempt_exclude_sec: 5.0  # 被接管（PREEMPTED_BY_MANUAL）交還的任務多久不接：只擋「回報先到、mode = MANUAL 晚到」的空檔；接管期間靠 MANUAL 不出價，做完回到 AUTO 就能接回（2026-10-17）
    # max_failures: 0         # 同一個任務 TRANSIENT 失敗幾次後永久不接；0 = 不啟用（只靠成功率 1/(1+f) 打折）
