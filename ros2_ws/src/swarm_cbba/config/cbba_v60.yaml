/**:   # 任何 namespace 下的 cbba_node 都吃這份（裸的 cbba_node: 對不到 /v60/cbba_node）
  ros__parameters:
    agent_id: 50
    agent_type: "UGV"
    state_timeout: 1.5
    assign_hold: 0.4          # spec §2.3 規則 1：2 個廣播週期（節點預設也是 0.4）
    # 速度、耗電、存量、bundle 上限：2026-11-15 起是平台的參數，數值在 registry/platforms.yaml（quadruped：1.0 m/s、
    # 0.1 %/m、0.05 %/s、存量 20 %、bundle 5，佔位、待實測；cbba_core/doc/ugv_tuning.md）。程式預設和它一樣；
    # 給 registry_dir 時讀 platforms.yaml。要單獨改這隻時用 -p（會蓋過註冊表並印警告）
    preempt_exclude_sec: 5.0  # 被接管（PREEMPTED_BY_MANUAL）交還的任務多久不接：只擋「回報先到、mode = MANUAL 晚到」的空檔；接管期間靠 MANUAL 不出價，做完回到 AUTO 就能接回（2026-10-17）
    # max_failures: 0         # 同一個任務 TRANSIENT 失敗幾次後永久不接；0 = 不啟用（只靠成功率 1/(1+f) 打折）
    cancel_authorities: [200] # 閘道（2-1b，participate: never）可以取消任何任務；全隊要一樣（2026-11-12）
