  - {id: TB2, class: transformer, site: yard, position: [-20.0, 0.0, 1.5]}
  - {id: TB3, class: transformer, site: yard, position: [-10.0, 0.0, 1.5]}
  - {id: TB4, class: transformer, site: yard, position: [0.0, 0.0, 1.5]}
  - {id: TB5, class: transformer, site: yard, position: [10.0, 0.0, 1.5]}
  - {id: TC1, class: transformer, site: yard, position: [-30.0, -15.0, 1.5]}
  - {id: TC2, class: transformer, site: yard, position: [-20.0, -15.0, 1.5]}
  - {id: TC3, class: transformer, site: yard, position: [-10.0, -15.0, 1.5]}
  - {id: TC4, class: transformer, site: yard, position: [0.0, -15.0, 1.5]}
