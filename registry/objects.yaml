# 物件（2-1b 註冊表 REG-1，schema 1.0；2026-11-15 照 2-1b 原文第三節改寫）
#
# 物件分類別（person）與實例（machine:TR-01、door:D3F-02）。這份只放**類別**（規劃器、VLM、檢查器的詞彙）；
# **實例**來自場域設定（site-config/<site>/devices.csv，例如 machine:TA1）或追蹤結果（person:trk_88），
# steps 的 object 寫「類別:實例」。
#
# 欄位
#   locate            怎麼取得位置：projection（攝影機投影）、onboard（機載偵測）、asset（設備清單座標）、
#                     asset_pose（設備清單座標＋觀察姿態）、site_map（場域地圖）、zone（所在區域）
#   allowed_actions   允許的動作（actions.yaml；和動作的 objects 要互相一致，未開放的動作也列）
#   safety_distance_m 最小安全距離（公尺），依平台：quadruped／uav；null = 不適用（原文的「—」）；
#                     per_instance = 依設備（devices.csv 的 safety_quadruped_m、safety_uav_m）
#   rules             安全規則（檢查器的「區域」「參數」層用）：no_overfly（不從上方飛過）、no_contact（不接觸）、
#                     no_enter（不進入）、avoid_ground（狗繞行）、approach_needs_approval（接近需核准）、
#                     high_voltage_zone（設備周圍加禁區）
#   findings          這類物件的觀測會產生什麼（Result 的 findings）：image、reading、detection
#   note              原文的備註
schema_version: "1.0"

classes:
  person:
    locate: [projection, onboard]
    allowed_actions: [inspect, track, speak]
    safety_distance_m: {quadruped: 1.5, uav: 3.0}
    rules: [no_overfly, approach_needs_approval]
    findings: [image, detection]
    note: 接近需核准；不從人頭上飛過

  bag:
    locate: [projection]
    allowed_actions: [inspect]
    safety_distance_m: {quadruped: 3.0, uav: 5.0}
    rules: [no_contact]
    findings: [image, detection]
    note: 不接觸、不移動

  machine:
    locate: [asset]
    allowed_actions: [inspect]                 # inspect 用 thermal／zoom
    safety_distance_m: per_instance
    rules: [high_voltage_zone]
    findings: [image, reading]
    note: 依設備安全距離；高壓設備加禁區

  gauge:
    locate: [asset_pose]
    allowed_actions: [inspect]                 # inspect 用 zoom
    safety_distance_m: {quadruped: 1.0, uav: null}
    rules: []
    findings: [reading]
    note: 讀值進 findings

  door:
    locate: [site_map]
    allowed_actions: [inspect, open_door, close_door]   # open／close 未開放
    safety_distance_m: {quadruped: null, uav: null}
    rules: []
    findings: [image]
    note: 可用門禁替代機械手臂

  smoke_region:
    locate: [zone]
    allowed_actions: [inspect]
    safety_distance_m: {quadruped: 5.0, uav: 5.0}
    rules: [no_enter]
    findings: [image, detection]
    note: 不進入煙霧區

  puddle:
    locate: [projection]
    allowed_actions: [inspect]
    safety_distance_m: {quadruped: 1.0, uav: null}
    rules: [avoid_ground]
    findings: [image]
    note: 狗防滑繞行

  extinguisher:
    locate: [site_map]
    allowed_actions: [pick_up, use_tool]       # 未開放
    safety_distance_m: {quadruped: null, uav: null}
    rules: []
    findings: []
    note: 操作能力到位後開放

  # ---- 原文沒有、我們的模擬要用的 ----
  fire:
    locate: [projection, onboard]
    allowed_actions: [inspect]
    safety_distance_m: {quadruped: 1.5, uav: 5.0}   # 狗停在火點前 1.5 m（伯宇的 BT）；無人機在 8 m 高度懸停監控
    rules: []
    findings: [image, detection]
    note: 模擬用 AprilTag 101 當火（apriltag_fire_detector）
