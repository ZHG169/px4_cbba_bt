  - {id: TC6, class: transformer, site: yard, position: [30.0, -15.0, 1.5]}   # 場景裡的模型名稱是 TC6_fire
  - {id: pipe_rack, class: pipe_rack, site: yard, position: [0.0, -28.0, 2.0]}
