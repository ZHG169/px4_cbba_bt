# 動作（2-1b 註冊表 REG-1，schema 1.0；2026-11-15 照 2-1b 原文第二節改寫）
#
# 2-1b 第二節的動作清單與註冊表範例（inspect）的格式：每個動作的參數、能處理的物件、需要的能力、前置條件、效果、逾時、
# 是否可取消、風險、各平台的實作與自主狀態。閘道、規劃器把任務寫成 steps（current_task.spec：{"steps": [{action, location,
# object, params}]}），各平台的 BT 照 action 名稱分派（狗：task_manager；無人機：uav_adapter）。狗和無人機用同一套名稱。
# 動作的 ROS Action 介面與失敗碼（REG-2）由伯宇定；參數的名稱照原文，預設值、範圍是初版，對過之後才凍結。
#
# 欄位（原文的欄位照原文名稱；標「我們加的」是原文沒有、檢查器要用的）
#   class          plannable（可規劃：規劃器、VLM 可用）／system（系統：安全層、BT 應急分支、值班觸發，不列入 VLM 詞彙）／
#                  internal（平台內部：只在特定平台的實作裡用，例如 UAV 的 takeoff、set_altitude，由 adapter 自動補）
#   status         open（開放）／closed（未開放：操作類動作，2-1b 第九節「不做」）                              （我們加的）
#   version        動作定義的版本（參數改了加 1）
#   params         參數：名稱 → {type, values（enum）, min, max, default, unit, required, description}
#                  type：float、int、string、bool、enum、string_list、waypoints（[[x, y, z], …]）、bbox（[x, y, w, h]）
#   location       step 的 location：required／optional／none（2-1b Goal 的 location，見 site-config 的位置標準） （我們加的）
#   object         step 的 object：required／optional／none                                                    （我們加的）
#   objects        能處理的物件類別（objects.yaml；和那一類的 allowed_actions 要互相一致）
#   requires       需要的能力：any_of 列出幾組能力，**符合其中一組**即可（例如 inspect 依 mode：rgb_camera 或 thermal_camera）；
#                  沒寫 = 不需要（只要平台有實作）
#   preconditions  開始前要成立的條件（下面 conditions 的名稱）；檢查器的「前置條件鏈」用前面各步的 effects 推
#   effects        做完之後成立的條件
#   timeout_s      逾時（s）；0 = 依參數算（go_to、patrol：距離 ÷ 速度＋餘裕；wait、track：duration_s＋餘裕）
#   cancelable     可以中途取消（2-1b：必須支援，對應 BT 的 halt() 與搶占）
#   risk           low／medium／high（high 或 autonomy 未到 field_verified 的組合 → 檢查器標 requires_approval）
#   failure_codes  這個動作除了 common_failure_codes 之外還會回的失敗碼                                         （我們加的）
#   implementations 平台（platforms.yaml 的 name）→ 實作；沒列的平台 = 不支援
#       backend              誰執行：task_manager（伯宇的狗 BT）、uav_adapter、gateway（閘道轉給控制中心）
#       interface            實作呼叫的介面（狗：Nav2、雲台 action；無人機：Node-RED 的 /MAV1/api/*，{ns} = fleet.yaml 的 ns）
#       sequence             由平台內部動作（class internal）組成時的順序
#       extra_preconditions  這個平台另外要的前置條件（例如 UAV 的 airborne）
#       extra_effects        這個平台另外的效果（例如 UAV 的 return_to_dock 之後 landed）
#       autonomy             自主狀態：not_started／in_development／sim_verified（模擬驗證過）／field_verified（實機驗證過）
schema_version: "1.0"

# 每個動作都可能回的失敗碼（2-1b 的 8 個失敗碼與預設處理見 cbba_core/failure_codes.hpp）
common_failure_codes: [E_PRECONDITION, E_SAFETY_STOP, E_LOW_BATTERY, E_COMM, E_HW]

# 前置條件／效果的詞彙（檢查器的前置條件鏈；UAV 的任務結束必須回到 landed）
conditions:
  - {name: at_location, description: "載具已經在 step 的 location（觀察點）附近，通常由前一步 go_to 達成"}
  - {name: airborne, description: "無人機在空中（平台狀態機 AIRBORNE）"}
  - {name: landed, description: "無人機在地上（平台狀態機 LANDED）"}
  - {name: has_observation, description: "已取得觀測（截圖、讀值、偵測結果，放 Result 的 findings）"}
  - {name: target_locked, description: "追蹤目標已鎖定（追蹤交接時，前者確認後者已鎖定才釋放）"}
  - {name: operator_notified, description: "已通知值班"}
  - {name: docked, description: "已回到充電樁／起降點"}

# 角色的里程碑（CB-4 第一批，2026-11-16，cbba_core/doc/cb4_design.md）：spec 步驟的 wait_for 用名稱、TASK_PROGRESS 用 bit。
# bit 只增不改（和 cbba_core/milestones.hpp 一致，test_registry 檢查）。kind：executor（跟著那一次正式指派，換人就清掉）、
# event（事件結果：換人後保留，只在同一個 incident revision、沒過期時算）、completion（任務完成，視為全部達成）
milestones:
  - {name: accepted, bit: 0, kind: executor, description: 正式指派、發出 current_task（cbba_node 判定）}
  - {name: en_route, bit: 1, kind: executor, description: 開始前往}
  - {name: arrived, bit: 2, kind: executor, description: 到達該角色第一個 go_to 的位置}
  - {name: started, bit: 3, kind: executor, description: 開始第一個非移動的 step}
  - {name: target_localized, bit: 4, kind: event, description: 已定位目標}
  - {name: target_locked, bit: 5, kind: executor, description: 追蹤已鎖定}
  - {name: has_observation, bit: 6, kind: event, description: 已取得觀測}
  - {name: completed, bit: 7, kind: completion, description: 任務完成（TASK_CLOSE reason 1，cbba_node 判定）}
  - {name: sync_reached, bit: 8, kind: executor, description: 到了 sync 的會合點、等同伴（BT 回報 ARRIVED_WAITING 時 cbba_node 自動加）}

actions:
  # ===== 可規劃 =====
  go_to:
    class: plannable
    status: open
    version: 1
    params:
      standoff_m: {type: float, min: 0.0, max: 20.0, default: 0.0, unit: m, description: "停在 location 前多遠（0 = 到點）"}
      altitude_m: {type: float, min: 1.0, max: 30.0, unit: m, description: "只有 UAV；沒給用區域屬性或平台的預設巡航高度（不由 VLM 決定）"}
    location: required
    object: none
    objects: []
    requires:
      any_of: [[mobility_ground], [mobility_air]]
    preconditions: []
    effects: [at_location]
    timeout_s: 0
    cancelable: true
    risk: low
    failure_codes: [E_UNREACHABLE, E_TIMEOUT]
    implementations:
      quadruped: {backend: task_manager, interface: navigate_to_pose, autonomy: sim_verified}   # Nav2 NavigateToPose
      uav:
        backend: uav_adapter
        sequence: [takeoff, set_altitude, fly_to]   # 必要時 takeoff → set_altitude → 飛往航點（adapter 依平台狀態機自動補）
        extra_effects: [airborne]
        autonomy: in_development

  patrol:
    class: plannable
    status: open
    version: 1
    params:
      waypoints: {type: waypoints, unit: m, description: "航點列（map 座標）；和 area 二選一"}
      area: {type: string, description: "區域 ID（zones.geojson），由實作在區域內產生巡邏線；和 waypoints 二選一"}
      loops: {type: int, min: 1, max: 100, default: 1, description: "圈數"}
    location: none
    object: none
    objects: []
    requires:
      any_of: [[mobility_ground], [mobility_air]]
    preconditions: []
    effects: []
    timeout_s: 0
    cancelable: true
    risk: low
    failure_codes: [E_UNREACHABLE, E_TIMEOUT]
    implementations:
      quadruped: {backend: task_manager, interface: navigate_through_poses, autonomy: not_started}   # Nav2 航點序列
      uav:
        backend: uav_adapter
        interface: "{ns}/patrol"     # 目前是 10 m 正方形，要改成可傳航點
        extra_preconditions: [airborne]
        autonomy: not_started

  inspect:
    class: plannable
    status: open
    version: 1
    params:
      mode: {type: enum, values: [rgb, thermal, zoom], default: rgb, description: "感測模式；需要的能力依模式（requires）"}
      duration_s: {type: float, min: 2.0, max: 60.0, default: 5.0, unit: s, description: "拍攝時間"}
      standoff_m: {type: float, min: 1.0, max: 20.0, unit: m, description: "觀察距離；不能小於物件的最小安全距離"}
    location: optional          # 沒給用 object 的位置（設備清單）或任務位置
    object: optional
    objects: [person, bag, machine, gauge, door, puddle, smoke_region, fire]
    requires:
      any_of:
        - [rgb_camera]          # mode = rgb
        - [thermal_camera]      # mode = thermal
        - [rgb_camera, zoom]    # mode = zoom
    preconditions: [at_location]   # 前一步應讓機器人到達觀察點
    effects: [has_observation]
    timeout_s: 90
    cancelable: true
    risk: low
    failure_codes: [E_TIMEOUT, E_TARGET_LOST]
    implementations:
      quadruped: {backend: task_manager, interface: /ptz_inspect, autonomy: sim_verified}   # 雲台轉向目標、拍攝、機載偵測
      uav:
        backend: uav_adapter
        sequence: [hover, capture]   # 對應 /MAV1/api/hover + 拍攝
        extra_preconditions: [airborne]
        autonomy: in_development

  track:
    class: plannable
    status: open
    version: 1
    params:
      bbox: {type: bbox, description: "影像上的目標框 [x, y, w, h]（px）；object 沒有 track_id 時用"}
      distance_m: {type: float, min: 1.0, max: 20.0, default: 2.0, unit: m, description: "保持距離"}
      duration_s: {type: float, min: 1.0, max: 600.0, default: 30.0, unit: s, description: "持續時間"}
    location: optional          # 目標最後出現的位置
    object: required            # 目標：person:<track_id>（追蹤結果的實例）
    objects: [person]
    requires:
      any_of: [[rgb_camera]]
    preconditions: []
    effects: [target_locked, has_observation]
    timeout_s: 0
    cancelable: true
    risk: medium                # 移動目標（接近人員）
    failure_codes: [E_TARGET_LOST, E_UNREACHABLE, E_TIMEOUT]
    implementations:
      quadruped: {backend: task_manager, interface: follow_person, autonomy: not_started}
      uav:
        backend: uav_adapter
        interface: "{ns}/track"      # 目前 2 m、30 s；要能指定目標、回報目標遺失
        extra_preconditions: [airborne]
        autonomy: not_started

  speak:
    class: plannable
    status: open
    version: 1
    params:
      template: {type: string, required: true, description: "語音範本 ID（例如 intrusion_warning）"}
      volume: {type: float, min: 0.0, max: 1.0, default: 0.8, description: "音量"}
    location: none
    object: optional            # 對誰說（person）
    objects: [person]
    requires:
      any_of: [[speaker]]
    preconditions: []
    effects: []
    timeout_s: 30
    cancelable: true
    risk: low
    failure_codes: [E_TIMEOUT]
    implementations:
      quadruped: {backend: task_manager, interface: speaker, autonomy: not_started}   # 機載喇叭
      # uav：不支援（除非有喇叭酬載）

  wait:
    class: plannable
    status: open
    version: 1
    params:
      duration_s: {type: float, min: 0.0, max: 3600.0, required: true, unit: s, description: "秒數"}
    location: none
    object: none
    objects: []
    requires: {}
    preconditions: []
    effects: []
    timeout_s: 0
    cancelable: true
    risk: low
    failure_codes: []
    implementations:
      quadruped: {backend: task_manager, interface: none, autonomy: not_started}   # 原地等待
      uav:
        backend: uav_adapter
        sequence: [hover]            # 懸停（受續航限制）
        extra_preconditions: [airborne]
        autonomy: in_development

  return_to_dock:
    class: plannable
    status: open
    version: 1
    params:
      dock: {type: string, description: "dock／pad ID（site-config 的 docks.csv）；沒給用 fleet.yaml 的 limits"}
    location: none
    object: none
    objects: []
    requires:
      any_of: [[mobility_ground], [mobility_air]]
    preconditions: []
    effects: [docked]
    timeout_s: 0
    cancelable: true
    risk: low
    failure_codes: [E_UNREACHABLE, E_TIMEOUT]
    implementations:
      quadruped: {backend: task_manager, interface: navigate_to_pose, autonomy: not_started}   # 回充電樁
      uav:
        backend: uav_adapter
        sequence: [fly_to, land]     # 飛回起降點 → land
        extra_effects: [landed]
        autonomy: in_development

  alert_operator:
    class: plannable
    status: open
    version: 1
    params:
      severity: {type: enum, values: [info, warning, critical], default: warning, description: "嚴重度"}
      message: {type: string, required: true, description: "訊息"}
      attachments: {type: string_list, description: "附件（截圖、影像片段的 URI）"}
    location: none
    object: none
    objects: []
    requires: {}
    preconditions: []
    effects: [operator_notified]
    timeout_s: 10
    cancelable: true
    risk: low
    failure_codes: [E_TIMEOUT]
    implementations:
      quadruped: {backend: gateway, interface: alert, autonomy: not_started}   # 經閘道送控制中心
      uav: {backend: gateway, interface: alert, autonomy: not_started}

  # ===== 系統動作（規劃器、VLM 不能用） =====
  report_state:
    class: system
    status: open
    version: 1
    params: {}
    location: none
    object: none
    objects: []
    requires: {}
    preconditions: []
    effects: []
    timeout_s: 5
    cancelable: true
    risk: low
    implementations:
      quadruped: {backend: task_manager, interface: robot_state, autonomy: sim_verified}   # 狀態 topic
      uav: {backend: uav_adapter, interface: "{ns}/state", autonomy: sim_verified}        # 實機 /MAV1/api/state、status；SITL px4_state_bridge

  emergency_stop:
    class: system
    status: open
    version: 1
    params: {}
    location: none
    object: none
    objects: []
    requires: {}
    preconditions: []
    effects: []
    timeout_s: 5
    cancelable: true
    risk: low
    implementations:
      quadruped: {backend: task_manager, interface: /emergency_stop, autonomy: sim_verified}   # 急停

  emergency_land:
    class: system
    status: open
    version: 1
    params: {}
    location: none
    object: none
    objects: []
    requires: {}
    preconditions: []
    effects: [landed]
    timeout_s: 60
    cancelable: true
    risk: low
    implementations:
      uav: {backend: uav_adapter, interface: "{ns}/land", autonomy: not_started}   # 一般降落由 return_to_dock

  # ===== 平台內部動作（只出現在 implementations 的 sequence，不出現在任務的 steps） =====
  takeoff:
    class: internal
    status: open
    version: 1
    params:
      altitude_m: {type: float, min: 0.5, max: 30.0, default: 1.5, unit: m, description: "起飛高度（實機 API 1.5 m）"}
    location: none
    object: none
    objects: []
    requires:
      any_of: [[mobility_air]]
    preconditions: [landed]
    effects: [airborne]
    timeout_s: 30
    cancelable: true
    risk: low
    implementations:
      uav: {backend: uav_adapter, interface: "{ns}/takeoff", autonomy: in_development}

  set_altitude:
    class: internal
    status: open
    version: 1
    params:
      altitude_m: {type: float, min: 0.5, max: 30.0, default: 3.0, unit: m, description: "高度（實機 API 3 m；上限看室內天花板、fleet.yaml 的 max_altitude_m）"}
    location: none
    object: none
    objects: []
    requires:
      any_of: [[mobility_air]]
    preconditions: [airborne]
    effects: []
    timeout_s: 30
    cancelable: true
    risk: low
    implementations:
      uav: {backend: uav_adapter, interface: "{ns}/set_altitude", autonomy: in_development}

  fly_to:
    class: internal
    status: open
    version: 1
    params: {}
    location: required
    object: none
    objects: []
    requires:
      any_of: [[mobility_air]]
    preconditions: [airborne]
    effects: [at_location]
    timeout_s: 0
    cancelable: true
    risk: low
    implementations:
      uav: {backend: uav_adapter, interface: "{ns}/goto", autonomy: in_development}   # 實機 API 目前沒有 goto，待補；SITL 是 offboard

  hover:
    class: internal
    status: open
    version: 1
    params:
      duration_s: {type: float, min: 0.0, max: 900.0, default: 5.0, unit: s, description: "懸停時間（受續航限制）"}
    location: none
    object: none
    objects: []
    requires:
      any_of: [[mobility_air]]
    preconditions: [airborne]
    effects: []
    timeout_s: 0
    cancelable: true
    risk: low
    implementations:
      uav: {backend: uav_adapter, interface: "{ns}/hover", autonomy: in_development}

  capture:
    class: internal
    status: open
    version: 1
    params: {}
    location: none
    object: none
    objects: []
    requires:
      any_of: [[rgb_camera], [thermal_camera]]
    preconditions: []
    effects: [has_observation]
    timeout_s: 10
    cancelable: true
    risk: low
    implementations:
      uav: {backend: uav_adapter, interface: camera, autonomy: in_development}

  land:
    class: internal
    status: open
    version: 1
    params: {}
    location: none
    object: none
    objects: []
    requires:
      any_of: [[mobility_air]]
    preconditions: [airborne]
    effects: [landed]
    timeout_s: 60
    cancelable: true
    risk: low
    implementations:
      uav: {backend: uav_adapter, interface: "{ns}/land", autonomy: in_development}

  # ===== 未開放（操作類動作，2-1b 第九節不做；先登記詞彙） =====
  open_door:
    class: plannable
    status: closed
    version: 1
    params: {}
    location: none
    object: required
    objects: [door]
    requires:
      any_of: [[manipulator]]
    preconditions: [at_location]
    effects: []
    timeout_s: 120
    cancelable: true
    risk: medium
    implementations:
      quadruped: {backend: task_manager, interface: manipulator, autonomy: not_started}   # 需機械手臂或門禁串接

  close_door:
    class: plannable
    status: closed
    version: 1
    params: {}
    location: none
    object: required
    objects: [door]
    requires:
      any_of: [[manipulator]]
    preconditions: [at_location]
    effects: []
    timeout_s: 120
    cancelable: true
    risk: medium
    implementations:
      quadruped: {backend: task_manager, interface: manipulator, autonomy: not_started}

  pick_up:
    class: plannable
    status: closed
    version: 1
    params: {}
    location: none
    object: required
    objects: [extinguisher]
    requires:
      any_of: [[manipulator, gripper]]
    preconditions: [at_location]
    effects: []
    timeout_s: 120
    cancelable: true
    risk: high
    implementations:
      quadruped: {backend: task_manager, interface: manipulator, autonomy: not_started}

  drop_off:
    class: plannable
    status: closed
    version: 1
    params: {}
    location: required
    object: none                # 放下手上的物件
    objects: []
    requires:
      any_of: [[manipulator, gripper]]
    preconditions: [at_location]
    effects: []
    timeout_s: 120
    cancelable: true
    risk: high
    implementations:
      quadruped: {backend: task_manager, interface: manipulator, autonomy: not_started}

  use_tool:
    class: plannable
    status: closed
    version: 1
    params:
      tool: {type: string, required: true, description: "工具（tools.yaml 的能力標籤）"}
    location: none
    object: required
    objects: [extinguisher]
    requires:
      any_of: [[manipulator, gripper]]
    preconditions: [at_location]
    effects: []
    timeout_s: 300
    cancelable: true
    risk: high
    implementations:
      quadruped: {backend: task_manager, interface: manipulator, autonomy: not_started}
