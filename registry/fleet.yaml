# 機隊（2-1b 註冊表 REG-1，schema 1.0，2026-11-14）
#
# 每台載具的機號、平台（platforms.yaml 的 name）、namespace、宣告的能力（tools.yaml 的 name）。
# cbba_node 給 registry_dir 時從這裡讀自己機號的平台與能力（取代 capabilities 參數；平台要和 agent_type 一致，
# 不一致就拒絕啟動）；不在清單裡的機號照舊用參數。能力故障（E_HW）在執行期扣掉，不改這份。
# gateways：閘道（非競標的 CBBA 協定節點，不是載具，不列入能力統計），cbba_node 用來判斷閘道在不在線。
#
# 目前是模擬的機隊（docker：uav1～3、dog1～3）；能力照節點原本的預設（UAV：mobility_air、rgb_camera；
# 狗：mobility_ground、rgb_camera），實機的能力（V60 的雲台變焦、熱像等）待和伯宇確認後再加。
schema_version: "1.0"
robots:
  - {id: 1, name: uav1, platform: uav, namespace: /uav1, capabilities: [mobility_air, rgb_camera]}
  - {id: 2, name: uav2, platform: uav, namespace: /uav2, capabilities: [mobility_air, rgb_camera]}
  - {id: 3, name: uav3, platform: uav, namespace: /uav3, capabilities: [mobility_air, rgb_camera]}
  - {id: 50, name: dog1, platform: quadruped, namespace: /v60, capabilities: [mobility_ground, rgb_camera]}
  - {id: 51, name: dog2, platform: quadruped, namespace: /v60_1, capabilities: [mobility_ground, rgb_camera]}
  - {id: 52, name: dog3, platform: quadruped, namespace: /v60_2, capabilities: [mobility_ground, rgb_camera]}
gateways:
  - {id: 200, name: gcs, namespace: /gcs}
