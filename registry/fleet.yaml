# 機隊（2-1b 註冊表 REG-1，schema 1.0；2026-11-15 照 2-1b 原文第四節加 ns、limits）
#
# 每台載具的機號、平台（platforms.yaml 的 name）、ns、宣告的能力（tools.yaml 的 name）、限制（limits）。
# cbba_node 給 registry_dir 時從這裡讀自己機號的平台與能力（取代 capabilities 參數；平台要和 agent_type 一致，
# 不一致就拒絕啟動）；不在清單裡的機號照舊用參數。能力故障（E_HW）在執行期扣掉，不改這份。
#   id        CBBA 機號（1～254；原文的 id 是名稱，我們的名稱放 name）
#   ns        ROS namespace；實機無人機是 Node-RED 的介面前綴（例如 /MAV1/api，多台 /MAV2/api…，adapter 不寫死）
#   limits    原文：UAV 的 max_altitude_m、max_flight_s、landing_pads（site-config 的 docks.csv）；
#             我們加：狗的 docks（充電樁）。檢查器的「參數」「續航」層用；cbba_node 用 max_altitude_m 擋太高的任務
#   floor     所在樓層（zones.geojson 的 floor_id；2026-11-18 任務欄位補齊 05）。單一樓層先寫在這裡，多樓層時改由
#             robot_state 帶；cbba_node 用它擋「任務在別層」（WRONG_FLOOR）。沒寫 = 不知道，不擋
# gateways：閘道（非競標的 CBBA 協定節點，不是載具，不列入能力統計），cbba_node 用來判斷閘道在不在線。
#
# 目前是模擬的機隊（docker：uav1～3、dog1～3，yard 場景）；能力照節點原本的預設（UAV：mobility_air、rgb_camera；
# 狗：mobility_ground、rgb_camera）；狗另外宣告 speaker（2026-11-20：入侵範本的 speak 要它；V60 的喇叭待伯宇確認）；dog3 另外宣告 manipulator（2026-11-19，itest group 的 G13：只有它能做要求 manipulator 的任務）。實機（V60 的雲台變焦、熱像、喇叭；室內無人機的 indoor_flight、高度 3 m）待和伯宇確認後再加
#（2-1b 第十節的待確認問題）。
schema_version: "1.0"
robots:
  - {id: 1, name: uav1, platform: uav, floor: 1, ns: /uav1, capabilities: [mobility_air, rgb_camera],
     limits: {max_altitude_m: 10.0, max_flight_s: 900, landing_pads: [PAD_1]}}
  - {id: 2, name: uav2, platform: uav, floor: 1, ns: /uav2, capabilities: [mobility_air, rgb_camera],
     limits: {max_altitude_m: 10.0, max_flight_s: 900, landing_pads: [PAD_2]}}
  - {id: 3, name: uav3, platform: uav, floor: 1, ns: /uav3, capabilities: [mobility_air, rgb_camera],
     limits: {max_altitude_m: 10.0, max_flight_s: 900, landing_pads: [PAD_3]}}
  - {id: 50, name: dog1, platform: quadruped, floor: 1, ns: /v60, capabilities: [mobility_ground, rgb_camera, speaker],
     limits: {docks: [DOCK_1]}}
  - {id: 51, name: dog2, platform: quadruped, floor: 1, ns: /v60_1, capabilities: [mobility_ground, rgb_camera, speaker],
     limits: {docks: [DOCK_2]}}
  - {id: 52, name: dog3, platform: quadruped, floor: 1, ns: /v60_2, capabilities: [mobility_ground, rgb_camera, speaker, manipulator],
     limits: {docks: [DOCK_3]}}
gateways:
  - {id: 200, name: gcs, ns: /gcs}
